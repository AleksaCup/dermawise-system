services:
  postgres:
    image: postgres:16
    container_name: dermawise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dermawise}
      POSTGRES_USER: ${POSTGRES_USER:-dermawise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dermawise}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: dermawise-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dermawise}
      DB_USER: ${POSTGRES_USER:-dermawise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dermawise}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERVICE_PORT:-8080}:8080"

volumes:
  postgres-data:
